<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Recuperar acesso · Financeiro HSN</title>
<style>
:root{font-family:system-ui,sans-serif;color:#18384c;background:#f0f4f8}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:540px;margin:5vh auto;background:#fff;padding:32px;border-radius:20px;box-shadow:0 12px 40px #18384c0a}small{color:#00887e;font-weight:750;letter-spacing:.07em}h1{font-size:28px;margin:12px 0}p{line-height:1.6}label{display:block;margin:20px 0 8px;font-weight:600}input{display:block;width:100%;margin-top:8px;padding:13px;border:1px solid #aabfce;border-radius:8px;font:inherit}button,a{font:inherit}button{background:#00887e;color:#fff;border:0;border-radius:8px;padding:13px 18px;cursor:pointer;margin:12px 0}button:disabled{opacity:.55;cursor:wait}a{color:#006f69}#status{white-space:pre-line;overflow-wrap:anywhere;padding:12px;background:#eef8f5;border-radius:8px}#status:empty{display:none}#status.error{background:#fff0ee;color:#982b26}[hidden]{display:none!important}:focus-visible{outline:3px solid #e8ac3b;outline-offset:3px}@media(max-width:480px){body{padding:12px}main{padding:24px;margin:2vh auto}}
</style></head><body><main>
<small>HOTEL SERRA NEGRA · FINANCEIRO V2</small><h1 id="title">Recuperar acesso</h1>
<p id="account"></p><p id="status" role="status" aria-live="polite">Conferindo seu acesso…</p>
<form id="request-form" hidden><p>Receba um link para definir uma nova senha. Abra o e-mail mais recente e siga o link.</p><button type="submit" id="send-link">Enviar link de recuperação</button></form>
<form id="password-form" hidden><p>Defina a senha que você usará para entrar no Financeiro HSN V2.</p><label>Nova senha<input id="new-password" type="password" autocomplete="new-password" minlength="8" required></label><label>Confirmar nova senha<input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required></label><p>Use pelo menos 8 caracteres.</p><button type="submit" id="save-password">Salvar nova senha</button></form>
<p><a href="./">Voltar para entrar no sistema</a></p>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/clone-guard.js"></script><script src="js/auth-recovery.js"></script></body></html>
